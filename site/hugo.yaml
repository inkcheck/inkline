baseURL: "https://inkcheck.github.io/inkline/"
title: inkline
locale: en-gb

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

enableInlineShortcodes: true
enableGitInfo: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Diagrams
      pageRef: /docs/diagrams
      weight: 2
    - name: Search
      weight: 8
      params:
        type: search
    - name: GitHub
      weight: 9
      url: "https://github.com/inkcheck/inkline"
      params:
        icon: github
  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1

params:
  description: Text-first technical diagrams on D2, styled by pluggable design systems.
  page:
    width: normal
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: false
  highlight:
    copy:
      enable: true
      display: hover
